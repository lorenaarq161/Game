rters of…',o:['Bananas','Wheat','Apples','Tea'],a:0,e:'Bananas are a major export, along with cacao and shrimp.'},{c:'Food',q:'S’mores are made with…',o:['Graham crackers, chocolate, marshmallow','Peanut butter and jelly','Cornbread and honey','Cheese and ham'],a:0,e:'A classic American campfire treat.'},{c:'Traditions',q:'August 10 in Ecuador commemorates…',o:['The first cry of independence (Quito, 1809)','Christmas Eve','Carnival','Harvest day'],a:0,e:'The Primer Grito de Independencia.'},{c:'Traditions',q:'US Independence Day is on…',o:['July 4','January 1','May 5','November 11'],a:0,e:'July 4 commemorates 1776.'},{c:'Geography',q:'Which countries border Ecuador?',o:['Colombia and Peru','Venezuela and Brazil','Chile and Bolivia','Panama and Peru'],a:0,e:'Colombia to the north, Peru to the south and east.'},{c:'Geography',q:'The Galápagos Islands are about…',o:['1,000 km off Ecuador’s coast','50 km off the coast','In the Amazon','Next to Quito'],a:0,e:'They lie in the Pacific, roughly 1,000 km from the mainland.'},{c:'Geography',q:'Cotopaxi is…',o:['An active volcano near Quito','A river','A beach town','A lake'],a:0,e:'One of the world’s highest active volcanoes.'},{c:'Geography',q:'The largest US state by area is…',o:['Alaska','Texas','California','Montana'],a:0,e:'Alaska, by a wide margin.'},{c:'Normal here?',q:'Saying “buen provecho” to people who are eating is…',o:['Normal in Ecuador','Normal in the USA','Rude in Ecuador','Unknown everywhere'],a:0,e:'In Ecuador it is polite. Americans more often say “enjoy.”'},{c:'Normal here?',q:'Peanut butter and jelly sandwiches are a classic in…',o:['The USA','Ecuador','Both','Neither'],a:0,e:'A standard American lunch.'});

chal(){main(hdr('Challenges')+`<div class=card><p id=ch>${C[Math.floor(Math.random()*C.length)]}</p></div><button onclick="$('#ch').textContent=C[Math.floor(Math.random()*C.length)]">Another one</button><button class=alt onclick="S.dn[S.u]=(S.dn[S.u]||0)+1;save();alert('Nice! +1 point')">We did it ✓</button>`)},

map(){main(hdr('Our World')+`<p class=mut>A simple list for now. A real map is planned for v2.</p><select id=pc><option>🇪🇨</option><option>🇺🇸</option><option>🌍</option></select><input id=pn placeholder="Place"><select id=pk><option value=v>Visited</option><option value=w>Want to visit</option></select><input id=pt placeholder="Short note"><button id=pa>Add place</button>`+S.pl.map(p=>`<div class="card ${p.u==S.u?'me':'you'}"><b>${p.c} ${esc(p.n)}</b> <small>${p.k=='v'?'visited':'wishlist'} · ${N[p.u]}</small><br>${esc(p.t)}</div>`).join('')+`<h3>Ideas to explore</h3>`+IDEAS.map(i=>`<div class=card>${i[0]} ${i[1]}</div>`).join(''));$('#pa').onclick=()=>{const n=$('#pn').value.trim();if(!n)return;S.pl.unshift({id:Date.now()+S.u,ts:Date.now(),u:S.u,c:$('#pc').value,n,k:$('#pk').value,t:$('#pt').value});save();go('map')}},
box(){const mine=S.box.filter(b=>b.to==S.u);main(hdr('Surprise Box')+`<select id=bt><option>Question</option><option>Challenge</option><option>Fun fact</option><option>Joke</option><option>Message</option></select><textarea id=bx rows=3 placeholder="Leave something for ${N[other()]}…"></textarea><button id=bs>Leave in the box</button><h3>For you</h3>`+(mine.length?mine.map(b=>`<div class=card><small>${b.d}</small><br>${b.open?`<b>${b.t}:</b> ${esc(b.x)}`:`<button data-i="${S.box.indexOf(b)}">🎁 Open</button>`}</div>`).join(''):'<p class=mut>Nothing yet.</p>'));
$('#bs').onclick=()=>{const x=$('#bx').value.trim();if(!x)return;S.box.unshift({id:Date.now()+S.u,ts:Date.now(),to:other(),t:$('#bt').value,x,d:new Date().toLocaleDateString(),open:false});save();alert('Saved! They will see it when they open the app as their profile.');go('box')};document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.box[+b.dataset.i].open=true;save();go('box')})}};
let cur='home';function go(n){cur=n;(V2[n])()}
function kq(c){const qs=K[c];main(hdr(c,'know')+qs.map((q,i)=>{const k=c+i,a=S.ans[k]||{};return`<div class=card><b>${q}</b><textarea data-k="${k}" rows=2 placeholder="Your answer…">${esc(a[S.u]||'')}</textarea><button data-s="${k}">Save</button>${a[other()]&&a[S.u]?`<p class=you><small>${N[other()]}</small><br>${esc(a[other()])}</p>`:a[other()]?'<small>Their answer is waiting. Save yours to see it.</small>':''}</div>`}).join(''));document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s,v=document.querySelector(`[data-k="${k}"]`).value.trim();if(!v)return;(S.ans[k]=S.ans[k]||{})[S.u]=v;save();kq(c)})}
function wyr(){const i=W.findIndex((w,k)=>!(S.wy[k]&&S.wy[k][S.u]!=null));if(i<0){main(hdr('Would you rather?','play')+'<p>You answered them all!</p>'+W.map((w,k)=>`<div class=card>${w[0]} / ${w[1]}<br><small>🇪🇨 ${S.wy[k]?.ec!=null?w[S.wy[k].ec]:'…'} · 🇺🇸 ${S.wy[k]?.us!=null?w[S.wy[k].us]:'…'}</small></div>`).join(''));return}
main(hdr('Would you rather?','play')+`<h2>${i+1}/${W.length}</h2><button data-p="0">${W[i][0]}</button><button data-p="1">${W[i][1]}</button>`);document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{(S.wy[i]=S.wy[i]||{})[S.u]=+b.dataset.p;save();wyr()})}
function riddle(i){const r=R[i%R.length];main(hdr('Riddles','play')+`<div class=card><p>${r[0]}</p><button class=alt onclick="this.outerHTML='<p><b>${r[1]}</b></p>'">Reveal</button></div><button onclick="riddle(${i+1})">Next</button>`)}
function emoji(i){const e=E[i%E.length];main(hdr('Emoji guess','play')+`<p class=big>${e[0]}</p><input id=eg placeholder="Your guess"><button id=ec>Check</button><button class=alt id=es>Show answer</button><button class=alt onclick="emoji(${i+1})">Next</button><p id=er></p>`);$('#ec').onclick=()=>{const g=$('#eg').value.toLowerCase();if(g&&e[1].split(' ').some(w=>g.includes(w))){S.sc[S.u]++;save();$('#er').textContent='✅ Yes! '+e[1]+' (+1)'}else $('#er').textContent='Not quite, try again.'};$('#es').onclick=()=>{$('#er').textContent='Answer: '+e[1]}}
function card(i){const v=V[i%V.length];main(hdr('Flashcards','lang')+`<div class=card style="text-align:center"><p class=big>${v[0]}</p><button class=alt onclick="this.outerHTML='<h2>${v[1]}</h2><small>${v[2]}</small>'">Flip</button></div><button onclick="card(${i+1})">Next</button>`)}
function memory(){const ems=shuf([...'🌋🦎🌽🦃🥧☕🎸🏔️',...'🌋🦎🌽🦃🥧☕🎸🏔️'].filter(c=>c.trim()));const sym=['🌋','🦎','🌽','🦃','🥧','☕','🎸','🏔️'],deck=shuf([...sym,...sym]);let a=null,m=0,lock=false;
main(hdr('Memory match','play')+`<div class=mem>${deck.map((d,i)=>`<button data-i="${i}">?</button>`).join('')}</div><p id=mr class=mut>Match all 8 pairs.</p>`);
document.querySelectorAll('.mem button').forEach(b=>b.onclick=()=>{if(lock||b.disabled)return;b.textContent=deck[+b.dataset.i];b.disabled=true;if(a===null){a=b;return}if(deck[+a.dataset.i]==deck[+b.dataset.i]){m++;a=null;if(m==8){S.sc[S.u]+=2;save();$('#mr').textContent='🎉 Done! +2 points'}}else{lock=true;const x=a;a=null;setTimeout(()=>{x.textContent='?';b.textContent='?';x.disabled=b.disabled=false;lock=false},800)}})}
/* ---------- GATE ---------- */
function gate(){main(`<h1>GRINGO × ECUATORIANA</h1><p class=tag>Two cultures. Two languages. A thousand things to discover.</p><div class=card><b>Who are you?</b><button data-u="ec">🇪🇨 I’m the Ecuatoriana</button><button class=alt data-u="us">🇺🇸 I’m the Gringo</button><input id=cd type=password inputmode=numeric maxlength=4 placeholder="${S.code?'Enter 4-digit code':'Create a 4-digit code'}"><small class=mut>This code is a light lock on this device.</small><p id=ge style="color:var(--t)"></p></div>`);
document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const c=$('#cd').value;if(!/^\d{4}$/.test(c)){$('#ge').textContent='Enter 4 digits.';return}if(!S.code)S.code=c;else if(S.code!=c){$('#ge').textContent='Wrong code.';return}S.u=b.dataset.u;save();ok=true;go('home');sync()})}
/* ---------- SYNC (Supabase) ---------- */
const CFG={url:'https://suapdbyfuoatgdlmblpv.supabase.co',key:'sb_publishable_YPSL4MgOFgITFEtohWyWpQ_6Kfgpp8Q',room:'b75ae3eb69f223161b24b75b'};
const on=()=>CFG.url&&CFG.key&&CFG.room;let sy='',pt=0,busy=false;
const ss=t=>{sy=t;const e=$('#sy');if(e)e.textContent=t};
const shared=()=>({sc:S.sc,dn:S.dn,ans:S.ans,wy:S.wy,j:S.j,pl:S.pl,box:S.box});
const rpc=(f,b)=>fetch(CFG.url+'/rest/v1/rpc/'+f,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key,...(CFG.key.startsWith('eyJ')?{Authorization:'Bearer '+CFG.key}:{})},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw 0;return r.json()});
function merge(R){R=R||{};for(const u of['ec','us']){S.sc[u]=Math.max(S.sc[u]||0,(R.sc||{})[u]||0);S.dn[u]=Math.max(S.dn[u]||0,(R.dn||{})[u]||0)}
for(const f of['ans','wy'])for(const k in R[f]||{})for(const u in R[f][k]){S[f][k]=S[f][k]||{};if(S[f][k][u]==null||u!=S.u)S[f][k][u]=R[f][k][u]}
for(const f of['j','pl','box']){const m={};[...(R[f]||[]),...S[f]].forEach(x=>{if(!x.id){m[Math.random()]=x;return}const o=m[x.id];m[x.id]=o?{...o,...x,open:!!(o.open||x.open)}:x});S[f]=Object.values(m).sort((a,b)=>(b.ts||0)-(a.ts||0))}}
async function sync(){if(!on()||busy)return;busy=true;try{const b=JSON.stringify(shared());merge(await rpc('get_room',{r:CFG.room}));await rpc('put_room',{r:CFG.room,d:shared()});try{localStorage.setItem('ge',JSON.stringify(S))}catch(e){}ss('☁️ Synced');if(ok&&b!=JSON.stringify(shared())&&['home','journal','box','map'].includes(cur)&&![...document.querySelectorAll('input,textarea')].some(x=>x.value))go(cur)}catch(e){ss('⚠️ Offline: saved on this device')}busy=false}
function push(){if(!on())return;clearTimeout(pt);pt=setTimeout(sync,800)}
setInterval(sync,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
gate();sync();
</script></body></html>
